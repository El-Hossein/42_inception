services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:inception
    restart: always
    networks:
      - inception
    secrets:
      - db_password
      - db_root_password
    environment:
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
        - mariadb_data:/var/lib/mysql
  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:inception
    restart: always
    networks:
      - inception
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    depends_on:
        - mariadb
    environment:
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_N: ${WP_ADMIN_N}
      WP_ADMIN_E: ${WP_ADMIN_E}
      WP_U_NAME: ${WP_U_NAME}
      WP_U_EMAIL: ${WP_U_EMAIL}
    volumes:
      - wordpress_data:/var/www/html
  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:inception
    restart: always
    networks:
      - inception
    ports:
      - "443:443"
    depends_on:
        - wordpress
    volumes:
      - wordpress_data:/var/www/html
      - adminer_data:/var/www/adminer
  redis:
      build:
        context: ./requirements/bonus/redis
      image: redis:inception
      restart: always
      depends_on:
        - wordpress
      networks:
        - inception
  adminer:
    build:
      context: ./requirements/bonus/adminer
    image: adminer:inception
    restart: always
    networks:
      - inception
    depends_on:
      - mariadb
    volumes:
      - adminer_data:/var/www/adminer
  website:
    build:
      context: ./requirements/bonus/website
    image: website:inception
    restart: always
    networks:
      - inception
    ports:
      - "8080:8080"
  ftp:
    build:
      context: ./requirements/bonus/ftp/
    image: ftp:inception
    depends_on:
      - wordpress
    volumes:
      - wordpress_data:/var/ftp/wordpress
    ports:
      - "21:21"
      - "40000-40005:40000-40005"
    networks:
      - inception
    restart: always
    environment:
      FTP_USER: ${FTP_USER}
    secrets:
      - ftp_user_password
  grafana:
    build:
      context: ./requirements/bonus/grafana
    image: grafana:inception
    restart: always
    networks:
      - inception
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - nginx
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SERVER_DOMAIN: ${DOMAIN_NAME}


      


volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/<user>/data/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/<user>/data/mariadb
  adminer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/<user>/data/adminer
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/<user>/data/grafana

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_user_password:
    file: ../secrets/ftp_user_password.txt

networks:
  inception:
